<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Identify the Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ecdc; --paper2:#e9dfc8; --card:#fbf7ee; --ink:#1d1b18; --ink2:#4a443b;
    --muted:#8a7f6c; --rule:#cbbd9f; --red:#c0392b; --red2:#e0533f; --teal:#1f6f78;
    --gold:#c9962e; --good:#2e7d4f; --shadow:0 8px 24px rgba(60,45,20,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(rgba(120,95,50,.07) 1px, transparent 1px),
      radial-gradient(1200px 700px at 50% -20%, #fffaf0 0%, transparent 60%);
    background-size:4px 4px, auto;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ---------- Masthead + scorecard ---------- */
  #scorecard{position:sticky;top:0;z-index:50;background:rgba(243,236,220,.96);
    backdrop-filter:blur(6px);border-bottom:3px double var(--ink);box-shadow:0 4px 18px rgba(60,45,20,.12)}
  .sc-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .brand{margin-right:auto;padding-top:2px;line-height:1}
  .brand .t{font-family:"Playfair Display",serif;font-weight:900;font-size:1.45rem;letter-spacing:-.01em;white-space:nowrap}
  .brand .t span{color:var(--red)}
  .brand .s{font-family:"Special Elite",monospace;font-size:.72rem;color:var(--muted);letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
  .players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-width:280px}
  .player{display:flex;align-items:center;gap:6px;min-width:0;background:var(--card);
    border:1.5px solid var(--ink);border-radius:4px;padding:5px 4px 5px 10px;box-shadow:2px 2px 0 var(--ink)}
  .player.lead{background:#fff4d6;border-color:var(--gold);box-shadow:2px 2px 0 var(--gold)}
  .player.lead .pname{color:#7a5410}
  .pname{background:transparent;border:none;color:var(--ink);font-weight:700;flex:1 1 auto;min-width:0;width:100%;font-size:.9rem;outline:none;font-family:inherit}
  .pname::placeholder{color:var(--muted);font-weight:600}
  .pname:focus{border-bottom:1px dashed var(--muted)}
  .score{min-width:28px;text-align:center;font-weight:800;font-family:"Playfair Display",serif;font-size:1.1rem;color:var(--red)}
  .sbtn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);font-weight:800;cursor:pointer;line-height:1;font-size:.95rem;flex:none;
    transition:transform .08s}
  .sbtn:active{transform:scale(.9)}
  .sbtn.plus{background:var(--teal);color:#fff;border-color:var(--teal)}
  .sbtn.minus{background:transparent;color:var(--ink)}
  .pdel{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:3px 5px;border-radius:4px;flex:none}
  .pdel:hover{color:var(--red);background:rgba(192,57,43,.08)}
  .pbtn{cursor:pointer;background:var(--ink);color:var(--paper);border:none;border-radius:4px;padding:9px 14px;font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 var(--red)}
  .pbtn:hover{background:#000}
  .sc-label{display:none;font-family:"Special Elite",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);padding-top:8px}
  #scorecard.tally-mode .players,#scorecard.tally-mode #addPlayer{display:none}
  #scorecard.tally-mode .sc-label{display:block}

  /* ---------- Stage ---------- */
  #stage{max-width:1180px;margin:14px auto;padding:0 20px 96px}
  .slide{display:none;animation:fade .35s ease}
  .slide.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sheet{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);padding:16px 24px 18px;position:relative}
  .sheet::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule);pointer-events:none}

  .qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
  .edition{font-family:"Special Elite",monospace;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .qtitle{font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(1.3rem,3.2vh,2rem);margin:6px 0 0;letter-spacing:-.01em}
  .qtitle em{color:var(--red);font-style:italic}
  .qsub{color:var(--ink2);margin:0 0 6px;font-size:.9rem}

  /* film-countdown timer */
  .timer{display:flex;align-items:center;gap:8px;font-weight:800}
  .dial{--p:100;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--ink) calc(var(--p)*1%), var(--paper2) 0);position:relative}
  .dial::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
  .dial b{position:relative;z-index:1;font-family:"Playfair Display",serif;font-size:1.05rem}
  .timer.warn .dial{background:conic-gradient(var(--red) calc(var(--p)*1%), var(--paper2) 0);animation:pulse 1s infinite}
  .timer.done .dial{background:var(--red)}
  .timer.done .dial b{color:var(--red)}
  @keyframes pulse{50%{transform:scale(1.08)}}

  /* polaroid photo wall */
  .wall{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:20px;padding:12px 6px 4px}
  .polaroid{background:#fff;padding:8px 8px 26px;box-shadow:0 6px 16px rgba(40,30,10,.22);cursor:zoom-in;position:relative;
    transition:transform .2s ease, box-shadow .2s ease}
  .polaroid:nth-child(3n+1){transform:rotate(-2deg)}
  .polaroid:nth-child(3n+2){transform:rotate(1.4deg)}
  .polaroid:nth-child(3n){transform:rotate(-.8deg)}
  .polaroid:hover{transform:rotate(0) scale(1.03);z-index:2;box-shadow:0 12px 28px rgba(40,30,10,.3)}
  .polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:22px;transform:translateX(-50%) rotate(-3deg);
    background:rgba(230,215,170,.75);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .polaroid .ph{aspect-ratio:4/3;max-height:calc(100vh - 560px);min-height:120px;width:100%;background:#222;overflow:hidden;display:grid;place-items:center}
  .polaroid img,.polaroid video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.02)}
  .polaroid .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:"Special Elite",monospace;font-size:.8rem;color:var(--ink2)}
  .polaroid .play{position:absolute;inset:8px 8px 26px;display:grid;place-items:center;pointer-events:none}
  .polaroid .play span{background:rgba(192,57,43,.92);color:#fff;font-weight:800;padding:10px 14px;border-radius:999px;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .polaroid .badge{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.08em;
    padding:3px 7px;border-radius:3px;text-transform:uppercase}

  /* headline clue clippings */
  .clips{margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .clip{background:var(--paper);border-left:4px solid var(--ink);padding:7px 12px;font-family:"Special Elite",monospace;font-size:.95rem;line-height:1.3;
    display:flex;gap:10px;align-items:flex-start}
  .clip .n{font-family:"Playfair Display",serif;font-weight:900;color:var(--red);font-size:1.1rem;line-height:1.1}
  .clip.locked{color:transparent;user-select:none;background:repeating-linear-gradient(-45deg,var(--paper2),var(--paper2) 8px,var(--paper) 8px,var(--paper) 16px);border-left-color:var(--rule)}
  .clip.locked .n{color:var(--muted)}
  .clip.locked::after{content:"Clue hidden — press 📰 Next Clue";color:var(--muted);font-family:Inter,sans-serif;font-size:.85rem}
  .clip.locked span:not(.n){display:none}
  .cat{display:inline-block;font-family:Inter,sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-right:8px;vertical-align:2px;color:#fff}
  .cat-world{background:var(--teal)}.cat-aus{background:#1a7a3a}.cat-tech{background:#3b4a8c}.cat-ent{background:#9a3a7a}
  .clip.fresh{animation:stamp .4s ease}
  .clip .match{display:none;margin-left:8px;font-family:Inter,sans-serif;font-size:.78rem;font-weight:800;color:var(--red);white-space:nowrap}
  .clip .match .cat{margin:0 0 0 4px}
  .slide.revealed .clip .match{display:inline}
  @keyframes stamp{from{transform:scale(1.04);background:#fff4d6}to{transform:none}}

  /* controls */
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
  .act{cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;padding:8px 14px;font-weight:700;font-size:.95rem;
    box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
  .act:active{transform:translate(2px,2px);box-shadow:none}
  .act.clue{background:var(--ink);color:var(--paper)}
  .act.hint{background:#fff4d6;border-color:var(--gold);box-shadow:2px 2px 0 var(--gold)}
  .act.answer{background:var(--red);color:#fff;border-color:var(--red);box-shadow:2px 2px 0 #7d2219}
  .act:disabled{opacity:.4;cursor:not-allowed}
  .feedback{margin-left:auto;font-weight:800;color:var(--red)}
  .hintbox{display:none;margin-top:14px;padding:12px 16px;background:#fff4d6;border:1px dashed var(--gold);font-family:"Special Elite",monospace}
  .hintbox.show{display:block;animation:fade .3s}
  .answerbox{display:none;margin-top:14px;padding:16px 18px;background:var(--paper);border:2px solid var(--ink);align-items:center;gap:20px}
  .answerbox.show{display:flex;animation:fade .3s}
  .stampyear{font-family:"Playfair Display",serif;font-weight:900;font-size:3.4rem;color:var(--red);border:4px solid var(--red);padding:2px 14px;
    transform:rotate(-6deg);line-height:1;flex:none;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes slam{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
  .answerbox p{margin:0;font-size:1rem;line-height:1.45}

  /* intro */
  .intro{text-align:center}
  .intro .kicker{font-family:"Special Elite",monospace;letter-spacing:.25em;text-transform:uppercase;color:var(--ink2);font-size:.85rem}
  .intro h1{font-family:"Playfair Display",serif;font-weight:900;font-size:3.4rem;margin:6px 0 4px;letter-spacing:-.02em}
  .intro h1 span{color:var(--red);font-style:italic}
  .intro .lead{max-width:720px;margin:0 auto 18px;color:var(--ink2);font-size:1.02rem;line-height:1.5}
  .rules{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;max-width:860px;margin:0 auto 20px;text-align:left;padding:0;list-style:none}
  .rules li{border-top:1px solid var(--ink);padding:9px 2px 0;font-size:.92rem;line-height:1.4}
  .rules b{color:var(--red)}
  .act.begin{font-size:1.1rem;padding:13px 34px;background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--red)}
  .intro .foot{font-family:"Special Elite",monospace;color:var(--muted);margin-top:14px;font-size:.85rem}

  /* nav */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px max(20px,calc((100vw - 1180px)/2 + 20px));display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(243,236,220,.96);backdrop-filter:blur(6px);border-top:3px double var(--ink);box-shadow:0 -4px 18px rgba(60,45,20,.12)}
  .navbtn{cursor:pointer;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:9px 20px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
  .navbtn:disabled{opacity:.35;cursor:not-allowed}
  .mid{display:flex;flex-direction:column;align-items:center;gap:5px}
  .progress{font-family:"Special Elite",monospace;color:var(--ink2);letter-spacing:.08em}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:620px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--rule);cursor:pointer}
  .dot.done{background:var(--teal)}
  .dot.active{background:var(--red);transform:scale(1.35)}

  /* tally */
  .tally{text-align:center}
  .tally .kicker{font-family:"Special Elite",monospace;letter-spacing:.25em;text-transform:uppercase;color:var(--ink2)}
  .winner{font-family:"Playfair Display",serif;font-weight:900;font-size:2.8rem;margin:4px 0;color:var(--red)}
  .winner-sub{color:var(--ink2);margin-bottom:20px}
  .ranklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;max-width:840px;margin:0 auto;text-align:left}
  .rankrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
  .rankrow.first{background:#fff4d6;border-bottom-color:var(--gold)}
  .rankrow .rk{width:38px;font-weight:800;color:var(--muted)}
  .rankrow .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rankrow .sc{font-family:"Playfair Display",serif;font-weight:900;font-size:1.3rem;color:var(--red)}

  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(20,16,10,.88);display:none;align-items:center;justify-content:center;z-index:200;padding:30px;cursor:zoom-out}
  #lightbox.show{display:flex}
  #lightbox .lbhint{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-weight:700}
  #lightbox img,#lightbox video{max-width:96vw;max-height:88vh;background:#fff;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  .hidden{display:none!important}
  @media (max-width:760px){
    .polaroid .ph{max-height:none}
    .players{grid-template-columns:repeat(2,1fr)}
    .wall{grid-template-columns:1fr 1fr}
    .clips,.rules,.ranklist{grid-template-columns:1fr}
    .qtitle{font-size:1.5rem}.intro h1{font-size:2.3rem}
    .sheet{padding:18px 16px}
    .answerbox.show{flex-direction:column;align-items:flex-start}
  }
  @media (max-width:480px){.wall{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="scorecard">
  <div class="sc-inner">
    <div class="brand"><div class="t">Identify the <span>Year</span></div><div class="s">The Team Time-Machine Quiz</div></div>

<div id="nav">

  <button class="navbtn" id="nextBtn">Next ›</button>
</div>

<div id="lightbox"></div>

/* Random round order on every new visit. Neighbouring rounds are kept at least 3 years apart,
   and the order is remembered for this tab so a refresh mid-game doesn't reshuffle. */
(function shuffleRounds(){
  const KEY='ity-order-v2', n=GAME.length;
  let order=null;
  try{ const s=JSON.parse(sessionStorage.getItem(KEY)); if(Array.isArray(s)&&s.length===n&&new Set(s).size===n) order=s; }catch(e){}
  if(!order){
    const idx=[...Array(n).keys()];
    for(let attempt=0; attempt<5000; attempt++){
      for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
      if(idx.every((v,i)=>i===0||Math.abs(GAME[v].y-GAME[idx[i-1]].y)>=3)) break;
    }
    order=idx.slice();
    try{ sessionStorage.setItem(KEY,JSON.stringify(order)); }catch(e){}
  }
  const copy=GAME.slice(); order.forEach((v,i)=>GAME[i]=copy[v]);
})();
function reshuffle(){ try{ sessionStorage.removeItem('ity-order-v2'); }catch(e){} location.href=location.pathname; }

const TIMER_SECONDS = 60;
const stage=document.getElementById('stage'), dotsWrap=document.getElementById('dots'),
      prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'),
      progress=document.getElementById('progress'), lightbox=document.getElementById('lightbox');
let current=-1, timerId=null;
const revealed = GAME.map(()=>false);      // answer shown?
// Clues are all shown, lettered A–D in a scrambled order; players match each one to an exhibit number.
const clueOrder = GAME.map(q=>{ const n=q.c.length, idx=[...Array(n).keys()];
  for(let t=0;t<50;t++){ for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } if(idx.every((v,i)=>v!==i)) break; }
  return idx; });
const LETTERS='ABCDEFGH';
const CATS={world:['🌍','World'],aus:['🇦🇺','Australia'],tech:['💻','Tech'],ent:['🎬','Entertainment']};
const catTag=c=>CATS[c]?`<span class="cat cat-${c}">${CATS[c][0]} ${CATS[c][1]}</span>`:'';
const esc = s => String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function mediaHTML(m, k){
  const badge = m.t==='video' ? '<span class="badge">🔊 Sound clip</span><div class="play"><span>▶ Click to play with sound</span></div>' : m.t==='gif' ? '<span class="badge">GIF</span>' : '';
  const inner = m.t==='video'
    ? `<video src="${esc(m.src)}${m.start?'#t='+m.start:''}" playsinline preload="metadata" ${m.poster?`poster="${esc(m.poster)}"`:''}></video>`
    : `<img src="${esc(m.src)}" alt="Photo clue ${k+1}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.polaroid').remove()">`;
  return `<figure class="polaroid" data-k="${k}" style="margin:0"><div class="ph">${inner}</div>${badge}<figcaption class="cap">Exhibit ${k+1}</figcaption></figure>`;
}

function buildSlides(){
  const intro=document.createElement('section');
  intro.className='slide'; intro.dataset.i=-1;
  intro.innerHTML=`
    <div class="sheet intro">
      <div class="kicker">★ Special Edition · 1990 – 2026 ★</div>
      <h1>Identify the <span>Year</span></h1>
      <p class="lead">Every round is a page torn from history, with plenty from home in Australia. Study the photos, clips and clues, then shout out the <b>year</b> it all happened. Everything is from <b>1990 to 2026</b>, so you lived through all of it!</p>
      <ul class="rules">
        <li><b>👆 Add players first:</b> use <b>＋ Add Player</b> in the scorecard above and type each name.</li>
        <li><b>🗞 Four desks per round:</b> 🌍 World, 🇦🇺 Australia, 💻 Tech and 🎬 Entertainment news.</li>
        <li><b>📷 Exhibits:</b> each round has four numbered exhibits, including a 🔊 video clip with sound. Click any exhibit to enlarge or play it (turn your speakers up!).</li>
        <li><b>📰 Clues:</b> all four clues (A–D) are on show, scrambled. Match each clue to its exhibit, then name the year.</li>
        <li><b>⏱ ${TIMER_SECONDS} seconds</b> per round. The timer starts when the round appears.</li>
        <li><b>💡 Hint</b> is a maths riddle that works out to the year, for when you're stuck. <b>🗓 Reveal Year</b> stamps the answer, shows which clue goes with which exhibit, and tells the story behind it.</li>
        <li><b>Scoring:</b> the host gives points with the +/− buttons. Suggestion: 3 pts for the exact year (2 if you used the hint), 1 pt for ±1 year, +1 for matching all four clues.</li>
      </ul>
      <button class="act begin" id="beginBtn">▶ Start the Time Machine</button>
      <button class="act" id="shuffleBtn" title="Deal the rounds in a new random order">🔀 Shuffle rounds</button>
      <div class="foot">Keys: ← → navigate · H hint · A reveal year · Esc closes photo</div>
    </div>`;
  stage.appendChild(intro);

  GAME.forEach((q,i)=>{
    const s=document.createElement('section');
    s.className='slide'; s.dataset.i=i;
    const n=Math.min(q.m.length,4);
    s.innerHTML=`
      <div class="sheet">
        <div class="qhead">
          <span class="edition">Round ${i+1} of ${GAME.length}</span>
          <span class="timer" data-timer><span class="dial"><b>${TIMER_SECONDS}</b></span></span>
        </div>
        <h2 class="qtitle">What <em>year</em> was this?</h2>
        <p class="qsub">Match each clue (A–D) to its exhibit (1–4), then name the year. Everything happened in the same year.</p>
        <div class="wall" style="--n:${n}">${q.m.map(mediaHTML).join('')}</div>
        <div class="clips">${clueOrder[i].map((k,pos)=>`<div class="clip" data-clip="${k}"><span class="n">${LETTERS[pos]}</span><span>${esc(q.c[k])}<span class="match">→ Exhibit ${k+1} ${catTag((q.m[k]||{}).cat)}</span></span></div>`).join('')}</div>
        <div class="actions">
          <button class="act hint" data-a="hint">💡 Hint</button>
          <button class="act answer" data-a="answer">🗓 Reveal Year</button>
          <span class="feedback" data-fb></span>
        </div>
        <div class="hintbox" data-hint>💡 <b>Maths riddle:</b> ${esc(q.h)}</div>
        <div class="answerbox" data-ans><div class="stampyear">${q.y}</div><p>${esc(q.e)}</p></div>
      </div>`;
    stage.appendChild(s);
    s.querySelector('[data-a="hint"]').onclick=()=>s.querySelector('[data-hint]').classList.toggle('show');
    s.querySelector('[data-a="answer"]').onclick=()=>revealAnswer(i);
    s.querySelectorAll('.polaroid').forEach(p=>p.onclick=()=>openLightbox(p));
  });

  const t=document.createElement('section');
  t.className='slide'; t.dataset.i=GAME.length;
  t.innerHTML=`
    <div class="sheet tally">
      <div class="kicker">★ Final Edition ★</div>
      <div class="winner" id="winnerName">—</div>
      <div class="winner-sub" id="winnerSub">Final Scores</div>
      <div class="ranklist" id="rankBody"></div>
      <div class="actions" style="justify-content:center">
        <button class="act" id="restartBtn">↺ Back to Round 1 (keep scores)</button>
        <button class="act" id="clearBtn">✕ Reset all scores</button>
      </div>
    </div>`;
  stage.appendChild(t);
  intro.querySelector('#beginBtn').onclick=()=>showSlide(0);
  intro.querySelector('#shuffleBtn').onclick=reshuffle;
  t.querySelector('#restartBtn').onclick=()=>showSlide(0);
  t.querySelector('#clearBtn').onclick=()=>{ if(confirm('Reset every player score to 0?')){ players.forEach(p=>p.score=0); save(); renderPlayers(); renderTally(); } };

  buildDots();
  const hm=location.hash.match(/^#r(\d+)$/);
  showSlide(hm ? Math.min(Math.max(+hm[1]-1,0),GAME.length-1) : -1);
}

function slideEl(i){ return stage.querySelector(`.slide[data-i="${i}"]`); }
function revealAnswer(i){
  const s=slideEl(i);
  s.classList.add('revealed');
  s.querySelector('[data-ans]').classList.add('show');
  revealed[i]=true; stopTimer(); markDots();
  const fb=s.querySelector('[data-fb]'); fb.textContent='';
}
function openLightbox(p){
  const media=p.querySelector('img,video'); if(!media) return;
  lightbox.innerHTML='';
  const clone = media.tagName==='VIDEO'
    ? Object.assign(document.createElement('video'),{src:media.src,controls:true,autoplay:true,muted:false,volume:1,playsInline:true})
    : Object.assign(document.createElement('img'),{src:media.currentSrc||media.src});
  if(clone.tagName==='IMG') clone.referrerPolicy='no-referrer';
  lightbox.appendChild(clone); lightbox.classList.add('show');
  if(clone.tagName==='VIDEO'){ clone.muted=false; clone.volume=1; clone.play().catch(()=>{});
    const h=document.createElement('div'); h.className='lbhint'; h.textContent='🔊 Sound on. Click outside the video or press Esc to close'; lightbox.appendChild(h); }
}
lightbox.onclick=e=>{ if(e.target.tagName!=='VIDEO'){ lightbox.classList.remove('show'); lightbox.innerHTML=''; } };

/* ---------- dots ---------- */
function buildDots(){
  dotsWrap.innerHTML='';
  for(let i=0;i<=GAME.length;i++){
    const d=document.createElement('div'); d.className='dot'; d.title= i<GAME.length?`Round ${i+1}`:'Final scores';
    d.onclick=()=>showSlide(i); dotsWrap.appendChild(d);
  }
}
function markDots(){
  [...dotsWrap.children].forEach((d,i)=>{ d.classList.toggle('active',i===current); d.classList.toggle('done',!!revealed[i]); });
}

/* ---------- timer ---------- */
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(i){
  stopTimer();
  const s=slideEl(i), wrap=s.querySelector('[data-timer]'), dial=wrap.querySelector('.dial'), num=dial.querySelector('b'), fb=s.querySelector('[data-fb]');
  let left=TIMER_SECONDS;
  const paint=()=>{ num.textContent=left; dial.style.setProperty('--p', left/TIMER_SECONDS*100);
    wrap.classList.toggle('warn',left<=10&&left>0); wrap.classList.toggle('done',left<=0); };
  fb.textContent='';
  if(revealed[i]){ left=0; paint(); wrap.classList.remove('done'); return; }
  paint();
  timerId=setInterval(()=>{ left--; paint(); if(left<=0){ stopTimer(); fb.textContent="⏱ Time's up! Lock in your answers."; } },1000);
}

/* ---------- navigation ---------- */
function showSlide(i){
  stopTimer(); current=i;
  try{ history.replaceState(null,'', i>=0&&i<GAME.length ? '#r'+(i+1) : location.pathname); }catch(e){}
  const isIntro=i===-1, isTally=i===GAME.length;
  stage.querySelectorAll('.slide').forEach(s=>s.classList.toggle('active',+s.dataset.i===i));
  stage.querySelectorAll('video').forEach(v=>v.pause());
  prevBtn.style.visibility=isIntro?'hidden':'visible';
  nextBtn.style.visibility=isIntro?'hidden':'visible';
  nextBtn.disabled=isTally;
  nextBtn.textContent= i===GAME.length-1 ? 'Final Scores ›' : isTally ? 'Done' : 'Next ›';
  progress.textContent= isIntro ? 'Instructions' : isTally ? 'Final Scores' : `Round ${i+1} / ${GAME.length}`;
  document.getElementById('scorecard').classList.toggle('tally-mode',isTally);
  if(isTally) renderTally();
  if(i>=0 && i<GAME.length) startTimer(i);
  markDots();
  window.scrollTo({top:0});
}
prevBtn.onclick=()=>{ if(current>0) showSlide(current-1); else if(current===0) showSlide(-1); };
nextBtn.onclick=()=>{ if(current<GAME.length) showSlide(current+1); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){ lightbox.classList.remove('show'); lightbox.innerHTML=''; return; }
  if(e.key==='ArrowRight') nextBtn.click();
  if(e.key==='ArrowLeft') prevBtn.click();
  if(current>=0 && current<GAME.length){
    const k=e.key.toLowerCase(), s=slideEl(current);
    if(k==='h') s.querySelector('[data-hint]').classList.toggle('show');
    if(k==='a') revealAnswer(current);
  }
});

/* ---------- scorecard (saved in this browser) ---------- */
let players;
try{ players=JSON.parse(localStorage.getItem('ity-players')) }catch(e){}
if(!Array.isArray(players)||!players.length) players=[{name:'',score:0},{name:'',score:0}];
function save(){ try{ localStorage.setItem('ity-players',JSON.stringify(players)); }catch(e){} }
const playersEl=document.getElementById('players');
function renderPlayers(){
  const max=Math.max(...players.map(p=>p.score),0);
  playersEl.innerHTML='';
  players.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='player'+(p.score>0&&p.score===max?' lead':'');
    el.innerHTML=`<input class="pname" value="${esc(p.name)}" placeholder="Player ${i+1}" aria-label="Player name"/>
      <button class="sbtn minus" title="Decrease">−</button><span class="score">${p.score}</span>
      <button class="sbtn plus" title="Increase">+</button><button class="pdel" title="Remove player">✕</button>`;
    const inp=el.querySelector('.pname');
    inp.oninput=()=>{ p.name=inp.value; save(); };
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); };
    el.querySelector('.plus').onclick=()=>{ p.score++; save(); renderPlayers(); };
    el.querySelector('.minus').onclick=()=>{ p.score--; save(); renderPlayers(); };
    el.querySelector('.pdel').onclick=()=>{ if(p.score===0||confirm(`Remove ${p.name||'Player '+(i+1)}?`)){ players.splice(i,1); save(); renderPlayers(); } };
    playersEl.appendChild(el);
  });
}
document.getElementById('addPlayer').onclick=()=>{
  players.push({name:'',score:0}); save(); renderPlayers();
  const ins=playersEl.querySelectorAll('.pname'); ins[ins.length-1].focus();
};
function renderTally(){
  const body=document.getElementById('rankBody'), wn=document.getElementById('winnerName'), ws=document.getElementById('winnerSub');
  const list=players.map((p,i)=>({...p,display:p.name.trim()||`Player ${i+1}`})).sort((a,b)=>b.score-a.score);
  body.innerHTML='';
  if(!list.length){ wn.textContent='No players'; ws.textContent=''; return; }
  const top=list[0].score, winners=list.filter(p=>p.score===top);
  if(top===0 && winners.length===list.length){ wn.textContent='Final Standings'; ws.textContent='No points scored yet!'; }
  else if(winners.length===1){ wn.textContent=winners[0].display; ws.textContent=`Wins with ${top} points 🎉`; }
  else if(winners.length===2){ wn.textContent=winners.map(w=>w.display).join(' & '); ws.textContent=`Tied at ${top} points!`; }
  else { wn.textContent="It's a Tie!"; ws.textContent=`${winners.length} players tied at ${top} points`; }
  const medals=['🥇','🥈','🥉'];
  list.forEach((p,i)=>{
    const r=document.createElement('div'); r.className='rankrow'+(p.score===top&&top>0?' first':'');
    r.innerHTML=`<span class="rk">${medals[i]||'#'+(i+1)}</span><span class="nm">${esc(p.display)}</span><span class="sc">${p.score}</span>`;
    body.appendChild(r);
  });
}

renderPlayers();
buildSlides();
</script>
</body>
</html>
